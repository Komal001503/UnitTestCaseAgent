name: Sync Azure DevOps User Stories

on:
  workflow_dispatch:
    inputs:
      org:
        description: 'Azure DevOps organisation (default: LnT-HeavyEngineering-IEMQS)'
        required: false
        default: 'LnT-HeavyEngineering-IEMQS'
      project:
        description: 'Azure DevOps project (default: Workforce Management by MX Techies)'
        required: false
        default: 'Workforce Management by MX Techies'
      team:
        description: 'Azure DevOps team (default: Workforce Management by MX Techies Team)'
        required: false
        default: 'Workforce Management by MX Techies Team'
      output_path:
        description: 'Output Markdown file path (default: azure_devops_user_stories.md)'
        required: false
        default: 'azure_devops_user_stories.md'
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch User Stories from Azure DevOps
        env:
          AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
          AZURE_DEVOPS_ORG: ${{ inputs.org || 'LnT-HeavyEngineering-IEMQS' }}
          AZURE_DEVOPS_PROJECT: ${{ inputs.project || 'Workforce Management by MX Techies' }}
          AZURE_DEVOPS_TEAM: ${{ inputs.team || 'Workforce Management by MX Techies Team' }}
        run: |
          python scripts/azure_devops_to_md.py \
            --output "${{ inputs.output_path || 'azure_devops_user_stories.md' }}"

      - name: Commit generated Markdown
        shell: bash
        run: |
          set -euo pipefail

          output_file="${{ inputs.output_path || 'azure_devops_user_stories.md' }}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$output_file"

          if git diff --cached --quiet; then
            echo 'No changes to commit — Markdown is already up to date.'
            exit 0
          fi

          git commit -m "Sync Azure DevOps user stories to ${output_file}"
          git push
