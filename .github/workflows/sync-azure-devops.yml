name: Sync Azure DevOps User Stories

on:
  workflow_dispatch:
    inputs:
      org:
        description: Azure DevOps organization
        required: false
        default: LnT-HeavyEngineering-IEMQS
        type: string
      project:
        description: Azure DevOps project
        required: false
        default: Workforce Management by MX Techies
        type: string
      team:
        description: Azure DevOps team (optional — leave blank to query at the project level)
        required: false
        type: string
      filter_mode:
        description: 'How to pick stories'
        required: true
        type: choice
        default: All
        options:
          - All
          - ByIteration
          - ByArea
          - ByBacklog
          - ByAssignee
          - ByTags
          - ByIds
      iteration_path:
        description: 'Iteration path (used when filter_mode=ByIteration). E.g. "Workforce Management by MX Techies\\Sprint 12"'
        required: false
        type: string
      area_path:
        description: 'Area path (used when filter_mode=ByArea)'
        required: false
        type: string
      backlog:
        description: 'Backlog/team name (used when filter_mode=ByBacklog). E.g. "IEMQS-SAP-Integration" or "Feature Team 1". Resolves the team''s configured Area Paths at runtime.'
        required: false
        type: string
      assigned_to:
        description: 'Assignee email or display name (used when filter_mode=ByAssignee)'
        required: false
        type: string
      tags:
        description: 'Comma-separated tags (used when filter_mode=ByTags). Story must contain ALL.'
        required: false
        type: string
      ids:
        description: 'Comma-separated work item IDs (used when filter_mode=ByIds)'
        required: false
        type: string
      state:
        description: 'Filter by State. Combine with any filter_mode above. Pick "Open" for New+Active+Resolved.'
        required: false
        type: choice
        default: All
        options:
          - All
          - New
          - Active
          - Resolved
          - Closed
          - Open
      states:
        description: 'Advanced override: comma-separated states (e.g. New,Active,Resolved). Takes precedence over the "state" choice when set.'
        required: false
        type: string
      work_item_type:
        description: 'Work item type'
        required: false
        type: choice
        default: User Story
        options:
          - User Story
          - Product Backlog Item
          - Issue
          - Requirement
      from_date:
        description: 'Optional. YYYY-MM-DD. Inclusive start date.'
        required: false
        type: string
      to_date:
        description: 'Optional. YYYY-MM-DD. Inclusive end date.'
        required: false
        type: string
      date_field:
        description: "Optional. Which date field the from/to dates apply to. Leave as 'None' to disable date filtering."
        required: false
        type: choice
        default: None
        options:
          - None
          - ChangedDate
          - CreatedDate
      output_path:
        description: 'Optional. Override the output Markdown file path. If blank, the file is named azure_devops_user_stories_<team-or-project>.md'
        required: false
        type: string
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Resolve filters
        id: resolve
        shell: bash
        env:
          MODE: ${{ inputs.filter_mode || 'All' }}
          STATE_CHOICE: ${{ inputs.state || 'All' }}
          STATES_CSV_INPUT: ${{ inputs.states }}
          ITERATION_PATH_INPUT: ${{ inputs.iteration_path }}
          AREA_PATH_INPUT: ${{ inputs.area_path }}
          BACKLOG_INPUT: ${{ inputs.backlog }}
          ASSIGNED_TO_INPUT: ${{ inputs.assigned_to }}
          TAGS_INPUT: ${{ inputs.tags }}
          IDS_INPUT: ${{ inputs.ids }}
          DATE_FIELD_INPUT: ${{ inputs.date_field }}
          FROM_DATE_INPUT: ${{ inputs.from_date }}
          TO_DATE_INPUT: ${{ inputs.to_date }}
        run: |
          set -euo pipefail
          iteration_path="$(printf '%s' "$ITERATION_PATH_INPUT" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          area_path="$(printf '%s' "$AREA_PATH_INPUT" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          backlog="$(printf '%s' "$BACKLOG_INPUT" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          assigned_to="$(printf '%s' "$ASSIGNED_TO_INPUT" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          tags="$(printf '%s' "$TAGS_INPUT" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          ids="$(printf '%s' "$IDS_INPUT" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          from_date="$(printf '%s' "$FROM_DATE_INPUT" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          to_date="$(printf '%s' "$TO_DATE_INPUT" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          date_field="$(printf '%s' "$DATE_FIELD_INPUT" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

          case "$MODE" in
            All)         echo "Using no scope filter (all stories)";;
            ByIteration)
              [[ -n "$iteration_path" ]] || { echo "filter_mode=ByIteration requires iteration_path." >&2; exit 1; }
              echo "iteration_path=$iteration_path" >> "$GITHUB_OUTPUT"
              ;;
            ByArea)
              [[ -n "$area_path" ]] || { echo "filter_mode=ByArea requires area_path." >&2; exit 1; }
              echo "area_path=$area_path" >> "$GITHUB_OUTPUT"
              ;;
            ByBacklog)
              [[ -n "$backlog" ]] || { echo "filter_mode=ByBacklog requires backlog." >&2; exit 1; }
              echo "backlog=$backlog" >> "$GITHUB_OUTPUT"
              ;;
            ByAssignee)
              [[ -n "$assigned_to" ]] || { echo "filter_mode=ByAssignee requires assigned_to." >&2; exit 1; }
              echo "assigned_to=$assigned_to" >> "$GITHUB_OUTPUT"
              ;;
            ByTags)
              [[ -n "$tags" ]] || { echo "filter_mode=ByTags requires tags." >&2; exit 1; }
              echo "tags=$tags" >> "$GITHUB_OUTPUT"
              ;;
            ByIds)
              [[ -n "$ids" ]] || { echo "filter_mode=ByIds requires ids." >&2; exit 1; }
              echo "ids=$ids" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "Unknown filter_mode '$MODE'" >&2; exit 1;;
          esac

          states_csv="$(printf '%s' "$STATES_CSV_INPUT" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          state_choice="$(printf '%s' "$STATE_CHOICE" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

          # Resolve State filter: the advanced "states" CSV takes precedence,
          # otherwise translate the "state" choice into a CSV.
          if [[ -n "$states_csv" ]]; then
            effective_states="$states_csv"
          else
            case "$state_choice" in
              All|"")  effective_states="";;
              Open)    effective_states="New,Active,Resolved";;
              *)       effective_states="$state_choice";;
            esac
          fi

          if [[ -n "$effective_states" ]]; then
            echo "states=$effective_states" >> "$GITHUB_OUTPUT"
            echo "Using State filter: $effective_states"
          else
            echo "Using no State filter (all states except Removed)"
          fi

          if [[ -n "$from_date" ]]; then
            echo "from_date=$from_date" >> "$GITHUB_OUTPUT"
          fi

          if [[ -n "$to_date" ]]; then
            echo "to_date=$to_date" >> "$GITHUB_OUTPUT"
          fi

          if [[ -n "$date_field" && "${date_field,,}" != "none" ]]; then
            echo "date_field=$date_field" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve output path
        id: outpath
        shell: bash
        env:
          OVERRIDE: ${{ inputs.output_path }}
          TEAM: ${{ inputs.team }}
          PROJECT: ${{ inputs.project || 'Workforce Management by MX Techies' }}
        run: |
          set -euo pipefail
          override="$(printf '%s' "$OVERRIDE" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [[ -n "$override" ]]; then
            echo "path=$override" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$(printf '%s' "$TEAM" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [[ -z "$base" ]]; then
            base="$PROJECT"
          fi
          sanitized="$(printf '%s' "$base" | sed 's/[^A-Za-z0-9._-]/_/g')"
          echo "path=azure_devops_user_stories_${sanitized}.md" >> "$GITHUB_OUTPUT"

      - name: Pull Azure DevOps user stories
        env:
          AZURE_DEVOPS_ORG: ${{ inputs.org || 'LnT-HeavyEngineering-IEMQS' }}
          AZURE_DEVOPS_PROJECT: ${{ inputs.project || 'Workforce Management by MX Techies' }}
          AZURE_DEVOPS_TEAM: ${{ inputs.team }}
          AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
          AZURE_DEVOPS_WORK_ITEM_TYPE: ${{ inputs.work_item_type }}
          AZURE_DEVOPS_STATES: ${{ steps.resolve.outputs.states }}
          AZURE_DEVOPS_ITERATION_PATH: ${{ steps.resolve.outputs.iteration_path }}
          AZURE_DEVOPS_AREA_PATH: ${{ steps.resolve.outputs.area_path }}
          AZURE_DEVOPS_BACKLOG: ${{ steps.resolve.outputs.backlog }}
          AZURE_DEVOPS_ASSIGNED_TO: ${{ steps.resolve.outputs.assigned_to }}
          AZURE_DEVOPS_TAGS: ${{ steps.resolve.outputs.tags }}
          AZURE_DEVOPS_IDS: ${{ steps.resolve.outputs.ids }}
          AZURE_DEVOPS_FROM_DATE: ${{ steps.resolve.outputs.from_date }}
          AZURE_DEVOPS_TO_DATE: ${{ steps.resolve.outputs.to_date }}
          AZURE_DEVOPS_DATE_FIELD: ${{ steps.resolve.outputs.date_field }}
          OUTPUT_PATH: ${{ steps.outpath.outputs.path }}
        run: python scripts/azure_devops_to_md.py --output "$OUTPUT_PATH" --verbose

      - name: Commit synced Markdown
        env:
          OUTPUT_PATH: ${{ steps.outpath.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail

          git add -- "$OUTPUT_PATH"

          if git diff --cached --quiet; then
            echo 'No Markdown changes to commit.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Sync Azure DevOps user stories ($(basename "$OUTPUT_PATH" .md | sed 's/^azure_devops_user_stories_//'))"
          git push

      # After the Markdown is committed, trigger the report workflow to generate
      # the Excel/Word test-case reports named after this project and today's date.
      # Go to Actions → "Run Tests & Export Word Report" → Run workflow.
