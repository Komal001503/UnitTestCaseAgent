name: Run Tests & Export Word Report

on:
  push:
    paths:
      - 'tests/**'
      - 'scripts/export_tests_to_text.py'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  run-tests-and-export:
    runs-on: ubuntu-latest

    env:
      AZURE_DEVOPS_PROJECT: ${{ vars.AZURE_DEVOPS_PROJECT || 'Workforce Management by MX Techies' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run unit tests
        run: |
          mkdir -p test_reports
          python -m pytest tests/ -v --tb=short --junitxml=test_reports/test_results.xml || true

      - name: Generate Word document report(s)
        run: |
          python scripts/export_tests_to_text.py --format docx --output-dir test_reports \
            --project-name "$AZURE_DEVOPS_PROJECT"

      - name: Generate Excel spreadsheet report(s)
        run: |
          python scripts/export_tests_to_text.py --format xlsx --output-dir test_reports \
            --project-name "$AZURE_DEVOPS_PROJECT"

      - name: Upload generated reports to FC S
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          run_date="$(date -u +%F)"
          report_files=(
            test_reports/*_test_report.docx
            test_reports/*_test_report.xlsx
            test_reports/unit_test_cases_report.docx
            test_reports/unit_test_cases_report.xlsx
          )

          if [[ "${#report_files[@]}" -eq 0 ]]; then
            echo 'No report files to upload.'
            exit 0
          fi

          for file in "${report_files[@]}"; do
            python scripts/fcs_uploader.py upload "$file" OUTPUT \
              --project-name "$AZURE_DEVOPS_PROJECT" --date-stamp "$run_date"
          done

      - name: Upload test reports as artifact
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-cases-reports-${{ github.run_id }}
          path: test_reports/*_test_report.*

      - name: Upload legacy report as artifact (if present)
        uses: actions/upload-artifact@v4
        if: hashFiles('test_reports/unit_test_cases_report.*') != ''
        with:
          name: unit-test-cases-report-legacy
          path: test_reports/unit_test_cases_report.*

      - name: Commit report to repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test_reports/
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Auto-generate unit test cases Word report'
            git push
          fi
